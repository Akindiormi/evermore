name: Diagnose Evermore Upload Keystore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EVERMORE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/upload.jks
          test -s /tmp/keystore/upload.jks

      - name: Check store password, alias, certificate and private key
        env:
          STORE_PASSWORD: ${{ secrets.EVERMORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EVERMORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EVERMORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== STORE CHECK ==="
          keytool -list -v -storetype PKCS12 \
            -keystore /tmp/keystore/upload.jks \
            -storepass "$STORE_PASSWORD" \
            | grep -E 'Alias name:|Entry type:|Owner:|Issuer:|SHA1:|SHA256:'
          echo "=== PRIVATE KEY CHECK ==="
          keytool -list -v -storetype PKCS12 \
            -keystore /tmp/keystore/upload.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            | grep -E 'Alias name:|Entry type:|Owner:|Issuer:|SHA1:|SHA256:'
          echo "=== RESULT: STORE AND PRIVATE KEY ACCESS OK ==="

# fresh diagnostic trigger
