name: Build Liora Web
on:
  push:
    branches: [main, liora-web-platform]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter config --enable-web
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: liora-web-build
          path: build/web
